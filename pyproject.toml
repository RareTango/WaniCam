[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wanicam"
version = "1.0.0"
description = "Find the IP cameras on your own network and watch them in your browser."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
wanicam = "wanicam.server:main"

[tool.setuptools]
packages = ["wanicam"]

[tool.setuptools.package-data]
wanicam = ["static/*"]
