name: Android APK

on:
  push:
    branches: [main, android-app]
    paths:
      - "android/**"
      - "tests/fake_camera.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg (used by the simulated camera in tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test camera logic against a simulated camera
        working-directory: android
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WaniCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WaniCam-apk
          path: WaniCam.apk

      # A stable download link for phones: the "android-latest" pre-release always holds the newest build.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest WaniCam.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "WaniCam for Android (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open this page on your phone, tap WaniCam.apk, and allow installing from your browser when Android asks."
